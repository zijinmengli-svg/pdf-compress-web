<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>TinyPDF 数据后台</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell admin-shell">
      <header class="dashboard-header">
        <div>
          <span class="eyebrow">TinyPDF</span>
          <h1 class="admin-title">TinyPDF 数据后台</h1>
        </div>
        <button class="secondary-button admin-logout" id="logout-button" type="button" hidden>退出登录</button>
      </header>

      <section class="panel admin-login" id="login-panel">
        <h2>后台登录</h2>
        <form class="form compact-form" id="login-form">
          <label class="field">
            <span>密码</span>
            <div class="inline-field">
              <input id="admin-password" type="password" autocomplete="current-password" required />
            </div>
          </label>
          <p class="field-error" id="login-error" hidden></p>
          <button type="submit">打开数据后台</button>
        </form>
      </section>

      <section id="dashboard" hidden>
        <div class="admin-section-head">
          <h2>概览</h2>
          <button class="secondary-button" id="refresh-button" type="button">刷新</button>
        </div>
        <div class="stat-grid" id="overview-grid"></div>

        <section class="table-card">
          <h3>下载历史数据</h3>
          <div class="download-actions">
            <a class="secondary-button" href="/api/admin/export?range=1m">近 1 个月</a>
            <a class="secondary-button" href="/api/admin/export?range=3m">近 3 个月</a>
            <a class="secondary-button" href="/api/admin/export?range=5m">近 5 个月</a>
            <a class="secondary-button" href="/api/admin/export?range=all">全部数据</a>
          </div>
        </section>

        <div class="dashboard-grid">
          <section class="table-card">
            <h3>访问来源</h3>
            <div id="sources-list" class="mini-list"></div>
          </section>
          <section class="table-card">
            <h3>国家/地区</h3>
            <div id="regions-list" class="mini-list"></div>
          </section>
          <section class="table-card">
            <h3>用户流程</h3>
            <div id="funnel-list" class="mini-list"></div>
          </section>
          <section class="table-card">
            <h3>文件类型</h3>
            <div id="file-categories" class="mini-list"></div>
          </section>
          <section class="table-card">
            <h3>压缩结果</h3>
            <div id="compression-list" class="mini-list"></div>
          </section>
        </div>

        <section class="table-card">
          <h3>推广来源</h3>
          <div class="table-wrap">
            <table>
              <thead><tr><th>平台</th><th>文章/内容</th><th>活动</th><th>访问</th><th>访客</th><th>压缩</th><th>下载</th></tr></thead>
              <tbody id="promotion-rows"></tbody>
            </table>
          </div>
        </section>

        <section class="table-card">
          <h3>最近上传的文件名</h3>
          <div class="table-wrap">
            <table>
              <thead><tr><th>时间</th><th>文件名</th><th>分类</th><th>原始大小</th><th>用户输入目标</th><th>压缩后大小</th></tr></thead>
              <tbody id="recent-files"></tbody>
            </table>
          </div>
        </section>

        <section class="table-card">
          <h3>最近事件</h3>
          <div class="table-wrap">
            <table>
              <thead><tr><th>时间</th><th>事件</th><th>来源</th><th>地区</th><th>设备</th><th>详情</th></tr></thead>
              <tbody id="recent-events"></tbody>
            </table>
          </div>
        </section>
      </section>
    </main>

    <script src="/admin.js?v=1.3.0" defer></script>
  </body>
</html>
