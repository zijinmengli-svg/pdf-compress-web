<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TinyPDF - 精准压缩PDF到指定大小，免费在线使用，无需安装。" />
    <meta name="keywords" content="PDF压缩,压缩PDF,PDF减小大小,PDF在线压缩,免费PDF压缩" />
    <meta name="author" content="TinyPDF" />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="TinyPDF - 精准压缩 PDF" />
    <meta property="og:description" content="精准压缩PDF到指定大小，免费在线使用，无需安装。" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://example.com/" />
    <meta property="og:locale" content="zh_CN" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TinyPDF - 精准压缩 PDF" />
    <meta name="twitter:description" content="精准压缩PDF到指定大小，免费在线使用，无需安装。" />
    <title>TinyPDF - 精准压缩 PDF | 免费在线工具</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="canonical" href="https://example.com/" />
    <!-- Google Analytics -->
    <script async src="https://analytics.tinypdf.cn/gtag/js?id=G-EGP898J99G"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-EGP898J99G', { transport_url: 'https://analytics.tinypdf.cn' });
    </script>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <span class="eyebrow">TinyPDF</span>
        <div class="usage-bar">
          <span class="usage-badge" id="usage-display" aria-live="polite">免费不限次 · 单文件 ≤ 100MB</span>
        </div>
      </header>

      <section class="hero">
        <h1>TinyPDF</h1>
        <h2 class="hero-sub">Precision PDF Compression.</h2>
        <p class="lead">仅支持电脑网页版、单个 PDF 文件压缩。保持页数、页面尺寸和版式不变，优先保留图片和文字清晰度。</p>
      </section>

      <section class="panel">
        <div class="config-row" id="config-bar"></div>

        <form id="compress-form" class="form" novalidate>
          <label class="dropzone" id="dropzone" for="pdf">
            <input id="pdf" name="pdf" type="file" accept="application/pdf" required />
            <span class="drop-title">上传 PDF 文件</span>
            <span class="drop-meta" id="file-meta">拖拽文件到此处，或点击选择文件</span>
          </label>

          <p class="field-error" id="file-error" hidden></p>

          <label class="field">
            <span>目标大小</span>
            <div class="inline-field">
              <input id="targetMB" name="targetMB" type="number" min="0.1" step="0.1" placeholder="例如 20" required />
              <span class="suffix">MB</span>
            </div>
            <div class="quality-warning" id="quality-warning" hidden>
              ⚠️ 当前压缩值过小，会导致文件损失过大
            </div>
          </label>

          <p class="field-error" id="target-error" hidden></p>

          <div class="action-row">
            <button id="submit-button" type="submit">开始压缩</button>
          </div>
        </form>

        <section class="status-card" id="status-card" hidden>
          <div class="status-header">
            <span id="status-title">准备中</span>
            <span id="status-percent">0%</span>
          </div>
          <div class="progress-track">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
          <p id="status-message">等待任务启动</p>
          <dl class="metrics" id="metrics"></dl>
          <div class="action-row" id="download-row" hidden>
            <button id="download-button" type="button">下载压缩文件</button>
          </div>
        </section>

      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <div>
          <strong>客服邮箱：</strong>
          <a href="mailto:zijinnmengli@gmail.com">zijinnmengli@gmail.com</a>
        </div>
        <p class="footer-agreement">使用该网站表明您同意<a href="/terms">使用协议</a></p>
      </div>
    </footer>

    <!-- 广告解锁弹窗（由后台 AD_ENABLED 控制是否启用） -->
    <div id="ad-modal" class="modal-overlay">
      <div class="modal-box">
        <button type="button" class="modal-close" id="ad-modal-close">×</button>
        <h2>大文件需观看广告解锁</h2>
        <p style="color:var(--muted);font-size:14px;margin:8px 0 16px">
          此文件较大，观看一段广告即可解锁本次压缩。
        </p>
        <div id="ad-slot-container" style="
          width:300px;height:250px;margin:0 auto 16px;
          background:#f3f4f6;border:1px dashed #d1d5db;border-radius:12px;
          display:flex;align-items:center;justify-content:center;
          color:#9ca3af;font-size:14px;
        ">广告加载中...</div>
        <div style="background:#e5e7eb;border-radius:4px;height:6px;margin-bottom:8px;overflow:hidden">
          <div id="ad-progress-bar" style="height:100%;width:0%;background:#374151;border-radius:4px;transition:width 1s linear"></div>
        </div>
        <p id="ad-countdown-text" style="text-align:center;font-size:13px;color:var(--muted);margin-bottom:16px">
          请观看广告，5 秒后可继续...
        </p>
        <p class="modal-error" id="ad-modal-error"></p>
        <div class="action-row" style="justify-content:center;gap:12px;flex-wrap:nowrap">
          <button type="button" class="btn-secondary" id="ad-tomorrow-btn" style="flex:1">取消</button>
          <button type="button" id="ad-claim-btn" disabled style="flex:2">请观看广告...</button>
        </div>
        <p class="modal-tip" style="margin-top:8px">小文件始终免费、不限次数</p>
      </div>
    </div>

    <!-- Toast 提示（无广告模式降级用） -->
    <div id="toast" class="toast" hidden></div>

    <script src="/app-simple.js?v=1.2.3" defer></script>
  </body>
</html>
